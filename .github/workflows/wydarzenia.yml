# Bot wydarzeń godej.pl – uruchamia się sam raz na dobę.
name: Bot wydarzeń

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zbierz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zbierz wydarzenia z oficjalnych źródeł
        run: node bot/zbierz-wydarzenia.mjs

      - name: Zapisz zmiany (tylko jeśli są nowe wydarzenia)
        run: |
          git config user.name "bot-wydarzen"
          git config user.email "bot-wydarzen@users.noreply.github.com"
          git add wydarzenia.json
          if git diff --cached --quiet; then
            echo "Brak zmian w wydarzeniach."
          else
            git commit -m "Aktualizacja wydarzeń $(date -u +%Y-%m-%d)"
            git push
          fi
